[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "tests/*",
    ".venv/*",

    # Tested at the function level (unit tests exercise the logic directly with
    # mocked SSH/subprocess boundaries), but omitted from the blended coverage
    # metric because most of their lines are large SSH command-building/parsing
    # branches that are impractical to drive end-to-end through the % metric.
    "core/scanner.py",
    "apps/mastodon.py",
    "apps/ghost.py",
    "apps/elk.py",
    "apps/jitsi.py",

    # Integration-only, genuinely thin: real coverage would require a live
    # Proxmox/PBS/UniFi endpoint. clients/proxmox_api.py and clients/pbs_client.py
    # now have ProxmoxClient(MagicMock())-style unit tests (see
    # tests/test_proxmox_client_methods.py, tests/test_pbs_client.py) and
    # clients/unifi_geoip.py's _is_private() helper is covered by
    # tests/test_unifi_geoip.py, so those three are no longer omitted.
    "clients/unifi_client.py",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.bandit]
exclude_dirs = [".venv", "__pycache__", "tests"]
skips = [
    "B104",  # binding to all interfaces — expected for server
    "B105",  # hardcoded password string — false positives on empty-string defaults
    "B107",  # hardcoded password default — false positives on empty-string defaults
    "B110",  # try-except-pass — used intentionally
    "B112",  # try-except-continue — used intentionally (e.g. CF Access key rotation)
    "B113",  # requests without timeout — false positives (timeouts are set)
    "B310",  # urllib urlopen audit — all URLs are constructed from https:// literals
    "B404",  # import subprocess — subprocess use is expected and controlled
    "B507",  # paramiko AutoAddPolicy — expected for internal infrastructure SSH tool
    "B601",  # paramiko exec_command — expected; inputs are validated upstream
    "B603",  # subprocess with non-constant args — expected
    "B607",  # partial executable path — expected
    "B608",  # SQL via string construction — queries run over SSH on managed hosts, not user input
]
