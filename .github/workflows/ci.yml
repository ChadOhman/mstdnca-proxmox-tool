name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  import-check:
    name: Import Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify app factory loads
        env:
          FLASK_SECRET_KEY: ci-test-secret
          DATABASE_URL: "sqlite:////tmp/ci-test.db"
          MSTDNCA_DATA_DIR: /tmp/mstdnca-ci
        run: python -c "from app import create_app; create_app()"

  ruff:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3.6.1 (v3)

  pytest:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          FLASK_SECRET_KEY: ci-test-secret
          DATABASE_URL: "sqlite:////tmp/ci-test.db"
          MSTDNCA_DATA_DIR: /tmp/mstdnca-ci
          MSTDNCA_SECRET_KEY: /tmp/mstdnca-ci/secret.key
        run: pytest tests/ -v --cov=. --cov-report=term-missing --cov-fail-under=40

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          scandir: scripts

  html-validate:
    name: Template Accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"

      - name: Run html-validate on templates
        # DEFERRED (see #129): verified locally with `npx html-validate@9` against
        # the actual templates/ tree. Most of the ~250 findings are not
        # rule-config false positives that .htmlvalidate.json could scope away —
        # they are parser-level failures (parser-error, attr-delimiter,
        # attribute-allowed-values, no-raw-characters) caused by raw Jinja2
        # syntax inside attribute values and control blocks (e.g.
        # `{% if x %}selected{% endif %}`, `action="/hosts/{{ host.id }}"`),
        # which the HTML tokenizer cannot parse and which no rule toggle fixes.
        # Making this blocking needs the templates pre-rendered with dummy
        # context before validation (or comparable de-Jinja-ing), which is a
        # templates/ change out of scope here. Left non-blocking until that
        # lands.
        continue-on-error: true
        env:
          GITHUB_ACTIONS: ""
        run: >
          npx --yes html-validate@9
          --config .htmlvalidate.json
          "templates/**/*.html"
