name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Every job runs on the self-hosted runner on the lambnet tool CT
# (scripts/setup-runner.sh): Debian 12, 2 cores, 1 GB RAM, one job at a time.
# Python is the system 3.11 — the same interpreter production runs under —
# in a venv per job, with pip's cache persisting on the runner between runs.
jobs:
  import-check:
    name: Import Check
    runs-on: [self-hosted, linux, x64, lambnet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create venv and install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -r requirements.txt

      - name: Verify app factory loads
        env:
          FLASK_SECRET_KEY: ci-test-secret
          DATABASE_URL: "sqlite:///${{ runner.temp }}/ci-test.db"
          MSTDNCA_DATA_DIR: ${{ runner.temp }}/mstdnca-ci
        run: .venv/bin/python -c "from app import create_app; create_app()"

  ruff:
    name: Ruff Lint
    runs-on: [self-hosted, linux, x64, lambnet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0 (v4)

  pytest:
    name: Tests
    runs-on: [self-hosted, linux, x64, lambnet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create venv and install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          FLASK_SECRET_KEY: ci-test-secret
          DATABASE_URL: "sqlite:///${{ runner.temp }}/ci-test.db"
          MSTDNCA_DATA_DIR: ${{ runner.temp }}/mstdnca-ci
          MSTDNCA_SECRET_KEY: ${{ runner.temp }}/mstdnca-ci/secret.key
        run: .venv/bin/pytest tests/ -v --cov=. --cov-report=term-missing --cov-fail-under=40

  shellcheck:
    name: ShellCheck
    runs-on: [self-hosted, linux, x64, lambnet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          scandir: scripts

  html-validate:
    name: Template Accessibility
    runs-on: [self-hosted, linux, x64, lambnet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"

      - name: Run html-validate on templates
        # DEFERRED (see #129): verified locally with `npx html-validate@9` against
        # the actual templates/ tree. Most of the ~250 findings are not
        # rule-config false positives that .htmlvalidate.json could scope away —
        # they are parser-level failures (parser-error, attr-delimiter,
        # attribute-allowed-values, no-raw-characters) caused by raw Jinja2
        # syntax inside attribute values and control blocks (e.g.
        # `{% if x %}selected{% endif %}`, `action="/hosts/{{ host.id }}"`),
        # which the HTML tokenizer cannot parse and which no rule toggle fixes.
        # Making this blocking needs the templates pre-rendered with dummy
        # context before validation (or comparable de-Jinja-ing), which is a
        # templates/ change out of scope here. Left non-blocking until that
        # lands.
        continue-on-error: true
        env:
          GITHUB_ACTIONS: ""
        run: >
          npx --yes html-validate@9
          --config .htmlvalidate.json
          "templates/**/*.html"
