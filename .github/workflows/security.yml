name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"  # Mondays at 9am UTC

permissions:
  contents: read

# Runs on the self-hosted runner (scripts/setup-runner.sh) with the system
# Python 3.11 in a per-job venv; see ci.yml for the reasoning.
jobs:
  bandit:
    name: Bandit Security Scan
    runs-on: [self-hosted, linux, x64, lambnet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install bandit
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet bandit

      - name: Run bandit
        run: .venv/bin/bandit -r . -c pyproject.toml

  dependency-audit:
    name: Dependency Audit
    runs-on: [self-hosted, linux, x64, lambnet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pip-audit
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet pip-audit

      - name: Audit dependencies
        run: .venv/bin/pip-audit -r requirements.txt -r requirements-dev.txt
