name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3.6.1 (v3)

      - name: Run tests with coverage
        env:
          FLASK_SECRET_KEY: ci-test-secret
          DATABASE_URL: "sqlite:////tmp/ci-test.db"
          MSTDNCA_DATA_DIR: /tmp/mstdnca-ci
          MSTDNCA_SECRET_KEY: /tmp/mstdnca-ci/secret.key
        run: pytest tests/ -v --cov=. --cov-report=term-missing --cov-fail-under=40

  release:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Verify VERSION file matches tag
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG_VERSION=${{ steps.version.outputs.version }}
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: VERSION file ($FILE_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Create release archive
        run: |
          tar -czf mstdnca-proxmox-tool-${{ steps.version.outputs.version }}.tar.gz \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.github' \
            --exclude='.claude' \
            .

      - name: Generate release notes
        id: notes
        run: |
          echo "## Mastodon Canada Administration Tool v${{ steps.version.outputs.version }}" > release_notes.md
          echo "" >> release_notes.md
          echo "### Quick Install" >> release_notes.md
          echo "" >> release_notes.md
          echo "**Option 1: One-command CT creation (run on Proxmox host):**" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "bash -c \"\$(curl -fsSL https://raw.githubusercontent.com/ChadOhman/mstdnca-proxmox-tool/main/scripts/create-ct.sh)\" -- --hostname mstdnca --ip dhcp" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "**Option 2: Manual setup (inside an existing Debian/Ubuntu CT):**" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "apt-get update && apt-get install -y git" >> release_notes.md
          echo "git clone https://github.com/ChadOhman/mstdnca-proxmox-tool.git /tmp/mstdnca" >> release_notes.md
          echo "cd /tmp/mstdnca && bash scripts/setup.sh" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "**Upgrade existing installation:**" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "bash /opt/mstdnca/scripts/update.sh" >> release_notes.md
          echo '```' >> release_notes.md
          echo "Or use the **Check for Updates** button in Settings." >> release_notes.md
          echo "" >> release_notes.md
          echo "### Default Credentials" >> release_notes.md
          echo "- Username: \`admin\`" >> release_notes.md
          echo "- Password: randomly generated on first run (check console/log output)" >> release_notes.md
          echo "- **Change the default password after first login!**" >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: release_notes.md
          files: mstdnca-proxmox-tool-${{ steps.version.outputs.version }}.tar.gz
          draft: false
          prerelease: false
